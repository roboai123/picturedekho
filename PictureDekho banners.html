<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PictureDekho | Banner carousel</title>
<style>
  /* ===== PASTE: CSS ===== */
  .pd-hero{position:relative;width:100%;max-width:1200px;margin:0 auto;aspect-ratio:21/9;min-height:280px;
    overflow:hidden;border-radius:14px;background:#14122b;color:#f6efe3;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .pd-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;
    background-size:cover;background-position:center;overflow:hidden}
  .pd-slide.active{opacity:1;visibility:visible}
  /* generated banner art */
  .pd-art{position:absolute;inset:0;
    background:
      radial-gradient(circle at 78% 35%,var(--c2) 0%,transparent 55%),
      repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px),
      linear-gradient(135deg,var(--c1),#0f0d22)}
  .pd-letter{position:absolute;right:4%;top:50%;transform:translateY(-52%);
    font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1;
    font-size:clamp(9rem,34vw,22rem);color:rgba(255,255,255,.09);user-select:none}
  .pd-slide::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(15,13,34,.85) 0%,rgba(15,13,34,.35) 50%,rgba(15,13,34,0) 85%),
               linear-gradient(0deg,rgba(15,13,34,.6) 0%,rgba(15,13,34,0) 40%)}
  .pd-info{position:absolute;z-index:2;left:clamp(16px,4vw,56px);bottom:clamp(44px,8vw,72px);max-width:min(560px,82%)}
  .pd-meta{font-size:clamp(.75rem,1.4vw,.95rem);opacity:.9;margin:0 0 .4rem}
  .pd-title{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.05;
    font-size:clamp(1.7rem,4.6vw,3.4rem);margin:0 0 .5rem}
  .pd-tag{font-size:clamp(.85rem,1.5vw,1rem);margin:0 0 1rem;opacity:.9}
  .pd-btn{border:0;cursor:pointer;background:#f2a93b;color:#14122b;font-weight:700;font-size:1rem;
    padding:.7rem 1.4rem;border-radius:999px}
  .pd-btn:hover{background:#ffbf5c}
  .pd-btn:focus-visible,.pd-arrow:focus-visible,.pd-dot:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .pd-arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
    border:0;cursor:pointer;background:rgba(246,239,227,.18);color:#fff;font-size:1.5rem;line-height:1}
  .pd-arrow:hover{background:rgba(246,239,227,.35)}
  .pd-prev{left:10px}.pd-next{right:10px}
  .pd-dots{position:absolute;z-index:3;right:clamp(16px,3vw,32px);bottom:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
  .pd-dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;cursor:pointer;background:rgba(246,239,227,.4)}
  .pd-dot.active{background:#f2a93b;width:24px;border-radius:6px;transition:width .3s}
  @media (max-width:600px){.pd-hero{aspect-ratio:4/5}.pd-arrow{display:none}
    .pd-slide::after{background:linear-gradient(0deg,rgba(15,13,34,.95) 0%,rgba(15,13,34,.25) 75%)}}
  @media (prefers-reduced-motion:reduce){.pd-slide,.pd-dot{transition:none}}
  .pd-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55);}
  .pd-poster{position:absolute;z-index:1;right:clamp(24px,8vw,120px);top:50%;transform:translateY(-50%);
    height:84%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  @media (max-width:600px){.pd-poster{top:6%;right:50%;transform:translateX(50%);height:46%}}
  /* ===== END CSS ===== */
  body{margin:0;padding:24px;background:#0e0c1f}
</style>
</head>

<!-- ===== PASTE: HTML (replace your current banner block) ===== -->
<section class="pd-hero" id="pdHero" aria-roledescription="carousel" aria-label="Featured movies">
  <div id="pdSlides"></div>
  <button class="pd-arrow pd-prev" aria-label="Previous movie">‹</button>
  <button class="pd-arrow pd-next" aria-label="Next movie">›</button>
  <div class="pd-dots" id="pdDots"></div>
</section>
<!-- ===== END HTML ===== -->

(function(){
  const hero = document.getElementById('pdHero');
  const slidesEl = document.getElementById('pdSlides');
  const dotsEl = document.getElementById('pdDots');
  let i = 0, timer = null;

  BANNER_MOVIES.forEach((m, n) => {
    const s = document.createElement('div');
    s.className = 'pd-slide' + (n === 0 ? ' active' : '');
    s.setAttribute('role','group');
    s.setAttribute('aria-label', `${n+1} of ${BANNER_MOVIES.length}`);

    const art = document.createElement('div');
    art.className = 'pd-art';
    art.style.setProperty('--c1', m.c1);
    art.style.setProperty('--c2', m.c2);
    s.appendChild(art);

    const letter = document.createElement('div');
    letter.className = 'pd-letter';
    letter.setAttribute('aria-hidden','true');
    letter.textContent = m.title.replace(/^(the|a)\s+/i,'').charAt(0).toUpperCase();
    s.appendChild(letter);

    /* poster: blurred copy fills the banner, sharp poster sits on the right */
    if (m.img) {
      const im = new Image();
      im.onload = () => {
        art.style.display = 'none'; letter.style.display = 'none';
        const bg = document.createElement('div');
        bg.className = 'pd-bg';
        bg.style.backgroundImage = `url("${m.img}")`;
        s.insertBefore(bg, s.firstChild);
        im.className = 'pd-poster';
        im.alt = m.title + ' poster';
        s.appendChild(im);
      };
      im.src = m.img;   /* if the file is missing, the generated banner stays */
    }

    const info = document.createElement('div');
    info.className = 'pd-info';
    info.innerHTML = `<p class="pd-meta"></p><h2 class="pd-title"></h2>
      <p class="pd-tag">Now showing in Prayagraj</p>
      <button class="pd-btn" type="button">Book Ticket</button>`;
    info.querySelector('.pd-meta').textContent = m.meta;
    info.querySelector('.pd-title').textContent = m.title;
    info.querySelector('.pd-btn').addEventListener('click', () => {
      if (typeof window.openBooking === 'function') window.openBooking(m.title);
      document.dispatchEvent(new CustomEvent('pd:book', { detail: m }));
    });
    s.appendChild(info);
    slidesEl.appendChild(s);

    const d = document.createElement('button');
    d.className = 'pd-dot' + (n === 0 ? ' active' : '');
    d.setAttribute('aria-label', `Show ${m.title}`);
    d.addEventListener('click', () => { go(n); restart(); });
    dotsEl.appendChild(d);
  });

  const slides = () => slidesEl.children, dots = () => dotsEl.children;
  function go(n){
    slides()[i].classList.remove('active'); dots()[i].classList.remove('active');
    i = (n + BANNER_MOVIES.length) % BANNER_MOVIES.length;
    slides()[i].classList.add('active'); dots()[i].classList.add('active');
  }
  function start(){ if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => go(i + 1), 5000); }
  function stop(){ clearInterval(timer); }
  function restart(){ stop(); start(); }

  hero.querySelector('.pd-prev').addEventListener('click', () => { go(i - 1); restart(); });
  hero.querySelector('.pd-next').addEventListener('click', () => { go(i + 1); restart(); });
  hero.addEventListener('mouseenter', stop);
  hero.addEventListener('mouseleave', start);
  hero.addEventListener('focusin', stop);
  hero.addEventListener('focusout', start);
  hero.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { go(i - 1); restart(); }
    if (e.key === 'ArrowRight') { go(i + 1); restart(); }
  });

  let x0 = null;
  hero.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; stop(); }, {passive:true});
  hero.addEventListener('touchend', e => {
    if (x0 !== null) { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); }
    x0 = null; start();
  });
  start();
})();
/* ===== END JavaScript ===== */
</script>
